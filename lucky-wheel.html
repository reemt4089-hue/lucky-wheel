<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع عجلة الحظ الشامل</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e272e 0%, #05c46b 100%);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .app-container {
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            width: 380px;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        h1 { color: #05c46b; margin-top: 0; font-size: 26px; }
        p { color: #555; font-size: 16px; margin-bottom: 25px; }

        /* الواجهة الأولى: شبكة الأقسام */
        .categories-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
        }

        .cat-card {
            padding: 25px 15px;
            font-size: 18px;
            font-weight: bold;
            border: 2px solid #05c46b;
            border-radius: 15px;
            background: white;
            color: #1e272e;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .cat-card:hover {
            background: #05c46b;
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(5, 196, 107, 0.3);
        }

        /* الواجهة الثانية: العجلة */
        .wheel-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .wheel-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 20px 0;
        }

        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 5px solid #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
            transition: transform 4s cubic-bezier(0.1, 0.8, 0.3, 1);
        }

        .segment {
            position: absolute;
            width: 50%;
            height: 50%;
            transform-origin: 100% 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .segment span {
            position: absolute;
            transform: rotate(45deg);
            font-weight: bold;
            color: #fff;
            font-size: 15px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
            bottom: 30px;
            right: 30px;
            width: 75px;
            text-align: center;
            word-wrap: break-word;
        }

        /* ألوان الأقسام */
        .seg1 { background-color: #ff3f34; top: 0; left: 0; transform: rotate(0deg); }
        .seg2 { background-color: #3c40c6; top: 0; left: 0; transform: rotate(90deg); }
        .seg3 { background-color: #05c46b; top: 0; left: 0; transform: rotate(180deg); }
        .seg4 { background-color: #ffa801; top: 0; left: 0; transform: rotate(270deg); }

        .pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 25px solid #ff3f34;
            z-index: 10;
        }

        .spin-btn {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background-color: #1e272e;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 15px;
        }

        .spin-btn:hover { background-color: #33414e; }

        .back-btn {
            background: none;
            border: none;
            color: #777;
            font-size: 15px;
            cursor: pointer;
            text-decoration: underline;
        }

        .back-btn:hover { color: #05c46b; }

        #result {
            margin-top: 15px;
            font-size: 22px;
            font-weight: bold;
            color: #1e272e;
            min-height: 30px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div id="homeScreen">
            <h1>🔮 ماذا تختار اليوم؟</h1>
            <p>اختر المجال الذي تحتار فيه لتفتح عجلتك الخاصة:</p>
            
            <div class="categories-grid">
                <button class="cat-card" onclick="openWheel('food')">🍔 قسم الأكل</button>
                <button class="cat-card" onclick="openWheel('games')">🎮 قسم الألعاب</button>
                <button class="cat-card" onclick="openWheel('reading')">📚 ماذا أقرأ؟</button>
                <button class="cat-card" onclick="openWheel('hobbies')">🎨 ماذا أفعل؟</button>
            </div>
        </div>

        <div id="wheelScreen" class="wheel-screen">
            <h1 id="wheelTitle">العجلة</h1>
            
            <div class="wheel-container">
                <div class="pointer"></div>
                <div class="wheel" id="wheel">
                    <div class="segment seg1"><span id="txt1"></span></div>
                    <div class="segment seg2"><span id="txt2"></span></div>
                    <div class="segment seg3"><span id="txt3"></span></div>
                    <div class="segment seg4"><span id="txt4"></span></div>
                </div>
            </div>

            <button class="spin-btn" id="spinBtn">لف العجلة! 🎰</button>
            <button class="back-btn" onclick="goBack()">⬅ العودة للأقسام</button>
            <div id="result"></div>
        </div>

    </div>

    <script>
        // البيانات الجاهزة باللغة العربية
        const data = {
            food: { title: "🍔 عجلة الأكل والوجبات", items: ["بيتزا 🍕", "برجر 🍔", "شاورما 🌯", "باستا 🍝"] },
            games: { title: "🎮 عجلة اختيار الألعاب", items: ["وتساب 🎲", "ببجي 🔫", "تيك توك⚽", "بلوت 🃏"] },
            reading: { title: "📚 عجلة القراءة والثقافة", items: ["رواية 📖", "كتاب علمي 🧪", "قصة قصيرة 📜", "مقال تقني 📱"] },
            hobbies: { title: "🎨 عجلة الأنشطة والترفيه", items: ["البرمجة 💻", "الرسم 🎨", "الرياضة 🏃‍♀️", "مشاهدة فيلم 🎬"] }
        };

        let currentCategory = '';
        let currentRotation = 0;

        const homeScreen = document.getElementById('homeScreen');
        const wheelScreen = document.getElementById('wheelScreen');
        const wheel = document.getElementById('wheel');
        const wheelTitle = document.getElementById('wheelTitle');
        const spinBtn = document.getElementById('spinBtn');
        const resultDiv = document.getElementById('result');
        
        const texts = [
            document.getElementById('txt1'),
            document.getElementById('txt2'),
            document.getElementById('txt3'),
            document.getElementById('txt4')
        ];

        function openWheel(category) {
            currentCategory = category;
            
            wheelTitle.innerText = data[category].title;
            for(let i=0; i<4; i++) {
                texts[i].innerText = data[category].items[i];
            }
            
            resultDiv.innerText = "";
            wheel.style.transform = `rotate(0deg)`;
            currentRotation = 0;

            homeScreen.style.display = "none";
            wheelScreen.style.display = "flex";
        }

        function goBack() {
            wheelScreen.style.display = "none";
            homeScreen.style.display = "block";
        }

        spinBtn.addEventListener('click', () => {
            resultDiv.innerText = "جاري الاختيار... ⏳";
            
            const randomDegrees = Math.floor(Math.random() * 360);
            const totalDegrees = randomDegrees + 1800; 
            currentRotation += totalDegrees;
            
            wheel.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                const actualDegrees = (currentRotation % 360);
                let winningIndex = 0;

                if (actualDegrees >= 0 && actualDegrees < 90) winningIndex = 0;
                else if (actualDegrees >= 90 && actualDegrees < 180) winningIndex = 3;
                else if (actualDegrees >= 180 && actualDegrees < 270) winningIndex = 2;
                else winningIndex = 1;

                const finalResult = data[currentCategory].items[winningIndex];
                resultDiv.innerText = `🎉 القرار هو: ${finalResult}`;
            }, 4000);
        });
    </script>

</body>
</html>
